name: Weekly alphaXiv to Zotero archive
on:
  schedule:
    - cron: '0 9 * * 1'
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      mode:
        description: Choose dry-run to preview, or apply to run the archive
        type: choice
        options: [dry-run, apply]
        default: dry-run
      monday:
        description: Missed run's Monday (YYYY-MM-DD); blank uses this week
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: weekly-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.event_name == 'workflow_dispatch' || vars.WEEKLY_ARCHIVE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflow logic
        run: python3 -m unittest discover -s tests
      - name: Verify or archive
        env:
          ALPHAXIV_API_KEY: ${{ secrets.ALPHAXIV_API_KEY }}
          ALPHAXIV_EXPECTED_FOLDER_ID: ${{ secrets.ALPHAXIV_EXPECTED_FOLDER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_COLLECTION_KEY: ${{ secrets.ZOTERO_COLLECTION_KEY }}
          OLD_SCHEDULE_CLEARED: ${{ vars.OLD_SCHEDULE_CLEARED }}
          RUN_MODE: ${{ inputs.mode || 'apply' }}
          RUN_MONDAY: ${{ inputs.monday }}
        shell: bash
        run: |
          args=()
          if [ "$RUN_MODE" = "apply" ]; then args+=(--apply); fi
          if [ -n "$RUN_MONDAY" ]; then args+=(--monday "$RUN_MONDAY"); fi
          python3 archive.py "${args[@]}"

